apiVersion: v1
kind: Service
metadata:
  name: jafra-controller
  namespace: jafra-system
spec:
  selector:
    app.kubernetes.io/name: jafra-controller
  ports:
    - name: webhook
      port: 443
      protocol: TCP
      targetPort: webhook
    - name: metrics
      port: 8080
      protocol: TCP
      targetPort: metrics
