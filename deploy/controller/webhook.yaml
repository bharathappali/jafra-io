apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: jafra-controller
  annotations:
    cert-manager.io/inject-ca-from: jafra-system/jafra-controller-serving-cert
webhooks:
  - name: pods.jafra.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: 5
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - jafra-system
    clientConfig:
      service:
        name: jafra-controller
        namespace: jafra-system
        path: /mutate-v1-pod
        port: 443
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
        scope: Namespaced
