apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-cache
  namespace: default
  labels:
    app.kubernetes.io/name: auth-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-cache
        jafra.io/enabled: "true"
        jafra.io/mode: "continuous"
      annotations:
        jafra.io/containers: "auth-cache"
        jafra.io/event: "ctimer"
        jafra.io/interval: "20ms"
        jafra.io/wall: "100ms"
        jafra.io/alloc: "1m"
        jafra.io/live: "true"
        jafra.io/lock: "10ms"
        jafra.io/nativemem: "2m"
        jafra.io/nativelock: "10ms"
        jafra.io/memlimit: "128m"
        jafra.io/loop: "1m"
        jafra.io/chunktime: "5s"
        jafra.io/chunksize: "32m"
        jafra.io/jfrsync: "default"
    spec:
      containers:
        - name: auth-cache
          image: quay.io/causa-ai-hub/quarkus-gc-pause:promotion-pressure-nd
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseContainerSupport
                -Xms256m
                -Xmx378m
                -Xlog:gc
            - name: GC_SCENARIO
              value: PROMOTION_PRESSURE
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-cache
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: auth-cache
  ports:
    - name: http
      port: 80
      targetPort: http
