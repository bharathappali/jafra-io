apiVersion: v1
kind: Pod
metadata:
  name: plain-pod
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sh
        - -c
        - sleep 3600
---
apiVersion: v1
kind: Pod
metadata:
  name: profiled-pod
  namespace: default
  labels:
    jafra.io/enabled: "true"
    jafra.io/mode: "continuous"
  annotations:
    jafra.io/containers: "app"
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sh
        - -c
        - sleep 3600
